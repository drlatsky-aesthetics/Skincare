<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Treasury Aesthetics — Treatment Advisor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --charcoal:   #0C0C0C;
      --charcoal-2: #1A1A1A;
      --charcoal-3: #222222;
      --charcoal-4: #2C2C2C;
      --charcoal-5: #363636;
      --gold:       #C4954A;
      --gold-light: #D4AF37;
      --gold-dim:   #7a5c2a;
      --gold-bg:    #1e1608;
      --text:       #E8E2D9;
      --text-muted: #7A7060;
      --text-dim:   #4A4540;
      --border:     #2A2520;
      --radius:     14px;
    }

    html, body { height: 100%; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--charcoal);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: var(--charcoal-2);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }
    .logo-mark {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .logo-mark svg { width: 20px; height: 20px; fill: var(--charcoal); }
    .header-text h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1rem; font-weight: 500;
      letter-spacing: 0.12em; text-transform: uppercase;
    }
    .header-text p { font-size: 0.7rem; font-weight: 300; color: var(--text-muted); margin-top: 1px; letter-spacing: 0.06em; }
    .header-badge {
      margin-left: auto;
      font-family: 'DM Mono', monospace; font-size: 0.62rem;
      color: var(--gold); border: 1px solid var(--gold-dim);
      border-radius: 4px; padding: 3px 8px; letter-spacing: 0.08em; text-transform: uppercase;
    }

    /* ── Messages ── */
    #messages {
      flex: 1; overflow-y: auto;
      padding: 28px 20px;
      display: flex; flex-direction: column; gap: 20px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: var(--charcoal-4); border-radius: 2px; }

    .msg-row { display: flex; align-items: flex-start; gap: 10px; }
    .msg-row.user  { justify-content: flex-end; }
    .msg-row.bot   { justify-content: flex-start; }

    .avatar {
      width: 30px; height: 30px; border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 2px;
    }
    .avatar.bot-av { background: linear-gradient(135deg, var(--gold), var(--gold-light)); }
    .avatar.bot-av svg { width: 15px; height: 15px; fill: var(--charcoal); }
    .avatar.user-av { background: var(--charcoal-4); color: var(--text-muted); font-size: 9px; letter-spacing: 0.04em; font-family: 'DM Mono', monospace; }

    .msg-content { display: flex; flex-direction: column; gap: 10px; max-width: min(76%, 680px); }
    .msg-row.user .msg-content { align-items: flex-end; }

    .bubble {
      padding: 13px 16px; border-radius: var(--radius);
      font-size: 0.875rem; line-height: 1.72; white-space: pre-wrap;
      word-break: break-word; font-weight: 300;
    }
    .msg-row.user .bubble {
      background: var(--charcoal-4); color: var(--text);
      border: 1px solid var(--border); border-bottom-right-radius: 3px;
    }
    .msg-row.bot .bubble {
      background: var(--charcoal-2); color: var(--text);
      border: 1px solid var(--border); border-bottom-left-radius: 3px;
    }

    /* ── Typing dots ── */
    .typing-dots { display: flex; align-items: center; gap: 5px; padding: 14px 18px; }
    .typing-dots span {
      display: block; width: 6px; height: 6px;
      background: var(--gold); border-radius: 50%;
      animation: pulse 1.3s infinite ease-in-out;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.18s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
      40%            { transform: scale(1);   opacity: 1; }
    }

    /* ── Plan Widget ── */
    .plan-widget {
      border: 1px solid var(--gold-dim);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--charcoal-3);
      width: 100%;
    }
    .plan-header {
      background: var(--gold-bg);
      border-bottom: 1px solid var(--gold-dim);
      padding: 12px 16px;
      display: flex; align-items: center; gap: 8px;
    }
    .plan-header-icon { color: var(--gold); font-size: 12px; }
    .plan-title {
      font-family: 'Playfair Display', serif;
      font-size: 0.9rem; color: var(--gold); flex: 1;
      letter-spacing: 0.04em;
    }
    .plan-copy-btn, .plan-export-btn, .plan-page-btn {
      font-family: 'DM Mono', monospace; font-size: 0.62rem;
      background: none; border: 1px solid var(--text-dim); border-radius: 4px;
      padding: 3px 9px; cursor: pointer; letter-spacing: 0.06em;
      text-transform: uppercase; transition: color 0.15s, border-color 0.15s, background 0.15s;
      white-space: nowrap;
    }
    .plan-copy-btn   { color: var(--text-muted); }
    .plan-export-btn { color: var(--gold); border-color: var(--gold-dim); }
    .plan-page-btn   { color: var(--gold-light); border-color: var(--gold-dim); }
    .plan-copy-btn:hover   { color: var(--gold);  border-color: var(--gold-dim); }
    .plan-export-btn:hover { color: #fff; border-color: var(--gold); background: var(--gold-dim); }
    .plan-page-btn:hover   { color: #000; border-color: var(--gold-light); background: var(--gold-light); }

    .plan-sections { padding: 4px 0; }

    .plan-section { border-bottom: 1px solid var(--border); }
    .plan-section:last-child { border-bottom: none; }

    .plan-section-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px 6px;
    }
    .plan-section-name {
      font-family: 'DM Mono', monospace; font-size: 0.65rem;
      color: var(--gold); letter-spacing: 0.1em; text-transform: uppercase;
    }
    .add-item-btn {
      font-size: 0.7rem; color: var(--text-dim); background: none;
      border: none; cursor: pointer; padding: 2px 4px;
      transition: color 0.15s;
    }
    .add-item-btn:hover { color: var(--gold); }

    .plan-items { padding: 0 10px 8px; }

    .plan-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 6px 6px; border-radius: 6px;
      transition: background 0.1s;
    }
    .plan-item:hover { background: var(--charcoal-4); }
    .plan-item:hover .delete-item-btn { opacity: 1; }

    .plan-item-check {
      width: 16px; height: 16px; border-radius: 4px;
      border: 1.5px solid var(--text-dim); cursor: pointer;
      flex-shrink: 0; margin-top: 2px;
      appearance: none; -webkit-appearance: none;
      background: transparent; transition: background 0.15s, border-color 0.15s;
      position: relative;
    }
    .plan-item-check:checked {
      background: var(--gold); border-color: var(--gold);
    }
    .plan-item-check:checked::after {
      content: '✓'; position: absolute;
      top: -1px; left: 1px;
      font-size: 11px; color: var(--charcoal); font-weight: 700;
    }

    .plan-item-body { flex: 1; min-width: 0; }
    .plan-item-name {
      font-size: 0.83rem; font-weight: 400; color: var(--text);
      display: block; line-height: 1.4;
    }
    .plan-item[data-checked="false"] .plan-item-name { color: var(--text-muted); }
    .plan-item-detail {
      font-size: 0.72rem; color: var(--text-dim); font-weight: 300;
      display: block; margin-top: 1px; line-height: 1.4;
    }

    .delete-item-btn {
      opacity: 0; background: none; border: none;
      color: var(--text-dim); cursor: pointer; font-size: 14px;
      padding: 0 4px; flex-shrink: 0;
      transition: color 0.15s, opacity 0.15s;
      line-height: 1;
    }
    .delete-item-btn:hover { color: #c0392b; }

    .add-item-row {
      display: flex; gap: 6px; padding: 4px 6px 6px;
    }
    .add-item-input {
      flex: 1; background: var(--charcoal-4);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 5px 10px; font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem; color: var(--text); outline: none;
    }
    .add-item-input:focus { border-color: var(--gold-dim); }
    .add-item-input::placeholder { color: var(--text-dim); }
    .add-item-confirm {
      background: var(--gold-dim); border: none; border-radius: 6px;
      color: var(--text); font-size: 0.75rem; padding: 5px 10px;
      cursor: pointer;
    }
    .add-item-confirm:hover { background: var(--gold); color: var(--charcoal); }
    .add-item-cancel {
      background: none; border: none; color: var(--text-dim);
      font-size: 0.75rem; padding: 5px 8px; cursor: pointer;
    }

    /* ── Item pricing controls ── */
    .plan-item { align-items: center; }
    .plan-item-controls {
      display: flex; align-items: center; gap: 8px; flex-shrink: 0; margin-left: auto;
    }
    .price-wrap {
      display: flex; align-items: center;
      border-bottom: 1px solid var(--text-dim); padding-bottom: 1px;
      transition: border-color 0.15s;
    }
    .price-wrap:focus-within { border-bottom-color: var(--gold); }
    .price-prefix {
      font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--text-dim);
    }
    .price-input {
      width: 48px; background: transparent; border: none;
      color: var(--text); font-family: 'DM Mono', monospace;
      font-size: 0.7rem; text-align: right; padding: 0 2px; outline: none;
    }
    .price-input::-webkit-inner-spin-button,
    .price-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .qty-ctrl { display: flex; align-items: center; gap: 3px; }
    .qty-btn {
      width: 17px; height: 17px; border-radius: 3px;
      background: var(--charcoal-4); border: 1px solid var(--border);
      color: var(--text-muted); cursor: pointer; font-size: 12px;
      display: flex; align-items: center; justify-content: center;
      line-height: 1; padding: 0; transition: color 0.1s, background 0.1s;
    }
    .qty-btn:hover { color: var(--gold); background: var(--charcoal-5); }
    .qty-val {
      font-family: 'DM Mono', monospace; font-size: 0.72rem;
      color: var(--text); min-width: 16px; text-align: center;
    }
    .line-total {
      font-family: 'DM Mono', monospace; font-size: 0.7rem;
      color: var(--text-muted); min-width: 52px; text-align: right;
    }
    .plan-item[data-checked="false"] .price-prefix,
    .plan-item[data-checked="false"] .price-input,
    .plan-item[data-checked="false"] .qty-val,
    .plan-item[data-checked="false"] .line-total { color: var(--text-dim); }

    /* ── Plan footer (totals + discount) ── */
    .plan-footer {
      border-top: 1px solid var(--border);
      padding: 11px 16px; display: flex; flex-direction: column; gap: 6px;
      background: var(--charcoal-3);
    }
    .plan-total-row {
      display: flex; align-items: center; justify-content: space-between;
    }
    .plan-total-label {
      font-family: 'DM Mono', monospace; font-size: 0.62rem;
      color: var(--text-muted); letter-spacing: 0.08em; text-transform: uppercase;
    }
    .plan-subtotal-val, .plan-disc-val, .plan-grand-val {
      font-family: 'DM Mono', monospace; font-size: 0.75rem; color: var(--text);
    }
    .plan-grand-val { color: var(--gold); font-size: 0.88rem; }
    .plan-grand-row { margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--border); }
    .plan-discount-row {
      display: flex; align-items: center; gap: 6px;
    }
    .disc-spacer { flex: 1; }
    .disc-type-sel {
      background: var(--charcoal-4); border: 1px solid var(--border); border-radius: 4px;
      color: var(--text-muted); font-family: 'DM Mono', monospace; font-size: 0.65rem;
      padding: 2px 4px; cursor: pointer; outline: none;
    }
    .disc-amount-input {
      width: 52px; background: var(--charcoal-4); border: 1px solid var(--border);
      border-radius: 4px; color: var(--text); font-family: 'DM Mono', monospace;
      font-size: 0.65rem; padding: 2px 6px; outline: none; text-align: right;
    }
    .disc-amount-input:focus { border-color: var(--gold-dim); }
    .disc-amount-input::-webkit-inner-spin-button,
    .disc-amount-input::-webkit-outer-spin-button { -webkit-appearance: none; }

    /* ── Quick buttons ── */
    #quick-bar {
      background: var(--charcoal-2); border-top: 1px solid var(--border);
      padding: 10px 16px 0; display: flex; gap: 7px; flex-wrap: wrap; flex-shrink: 0;
    }
    .quick-btn {
      font-family: 'DM Mono', monospace; font-size: 0.6rem;
      letter-spacing: 0.08em; text-transform: uppercase;
      background: var(--charcoal-3); border: 1px solid var(--border);
      border-radius: 20px; padding: 5px 11px; cursor: pointer; color: var(--text-muted);
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      white-space: nowrap;
    }
    .quick-btn:hover { color: var(--gold); border-color: var(--gold-dim); background: var(--gold-bg); }

    /* ── Input area ── */
    #input-area {
      background: var(--charcoal-2); border-top: 1px solid var(--border);
      padding: 10px 16px 14px; display: flex; gap: 10px;
      align-items: flex-end; flex-shrink: 0;
    }
    #user-input {
      flex: 1; resize: none; border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 14px;
      font-family: 'DM Sans', sans-serif; font-size: 0.875rem;
      font-weight: 300; color: var(--text); background: var(--charcoal-3);
      outline: none; max-height: 130px; line-height: 1.55;
      transition: border-color 0.15s;
    }
    #user-input:focus   { border-color: var(--gold-dim); }
    #user-input::placeholder { color: var(--text-dim); }

    #send-btn {
      width: 40px; height: 40px; border-radius: 9px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: opacity 0.15s, transform 0.1s;
    }
    #send-btn:hover  { opacity: 0.88; }
    #send-btn:active { transform: scale(0.93); }
    #send-btn:disabled { background: var(--charcoal-4); cursor: not-allowed; opacity: 1; }
    #send-btn svg { width: 16px; height: 16px; fill: var(--charcoal); }
    #send-btn:disabled svg { fill: var(--text-dim); }

    footer {
      text-align: center; font-size: 0.65rem; font-weight: 300;
      color: var(--text-dim); padding: 6px 20px 10px;
      letter-spacing: 0.04em; background: var(--charcoal-2); flex-shrink: 0;
    }
    footer a { color: var(--gold-dim); text-decoration: none; }

    /* ── Generate Page Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.82);
      z-index: 300; display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .modal {
      background: var(--charcoal-2); border: 1px solid var(--border);
      border-radius: var(--radius); width: 100%; max-width: 460px;
      max-height: 90dvh; display: flex; flex-direction: column;
      overflow: hidden; box-shadow: 0 24px 80px rgba(0,0,0,0.7);
    }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 15px 18px; border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .modal-head-title {
      font-family: 'Playfair Display', serif;
      font-size: 0.92rem; font-weight: 500; color: var(--gold);
      letter-spacing: 0.05em;
    }
    .modal-close {
      background: none; border: none; color: var(--text-muted);
      font-size: 20px; cursor: pointer; padding: 0 4px; line-height: 1;
      transition: color 0.15s;
    }
    .modal-close:hover { color: var(--text); }
    .modal-tabs {
      display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .modal-tab {
      flex: 1; padding: 9px 12px; background: none; border: none;
      color: var(--text-muted); font-family: 'DM Mono', monospace;
      font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer; border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .modal-tab.active { color: var(--gold); border-bottom-color: var(--gold); }
    .modal-body {
      flex: 1; overflow-y: auto; padding: 18px;
      display: flex; flex-direction: column; gap: 13px;
    }
    .modal-body::-webkit-scrollbar { width: 4px; }
    .modal-body::-webkit-scrollbar-thumb { background: var(--charcoal-4); border-radius: 2px; }
    .mf-row { display: flex; gap: 10px; }
    .mf-row .modal-field { flex: 1; }
    .modal-field { display: flex; flex-direction: column; gap: 4px; }
    .modal-label {
      font-family: 'DM Mono', monospace; font-size: 0.6rem;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted);
    }
    .modal-input, .modal-textarea {
      background: var(--charcoal-3); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 11px;
      font-family: 'DM Sans', sans-serif; font-size: 0.83rem;
      color: var(--text); outline: none; width: 100%;
      transition: border-color 0.15s;
    }
    .modal-input:focus, .modal-textarea:focus { border-color: var(--gold-dim); }
    .modal-textarea { resize: vertical; min-height: 72px; line-height: 1.55; }
    .modal-hint {
      font-size: 0.67rem; color: var(--text-dim); font-weight: 300; line-height: 1.4;
    }
    .modal-hint code { font-family: 'DM Mono', monospace; background: var(--charcoal-4); padding: 1px 4px; border-radius: 3px; }
    .modal-footer {
      padding: 12px 18px; border-top: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
    }
    .modal-actions { display: flex; gap: 8px; }
    .modal-btn {
      flex: 1; padding: 9px 14px; border: none; border-radius: 8px;
      cursor: pointer; font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem; font-weight: 500; letter-spacing: 0.03em;
      transition: opacity 0.15s, background 0.15s, color 0.15s;
    }
    .modal-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .modal-btn-primary {
      background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: #000;
    }
    .modal-btn-primary:not(:disabled):hover { opacity: 0.88; }
    .modal-btn-secondary {
      background: var(--charcoal-4); color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .modal-btn-secondary:not(:disabled):hover { color: var(--text); border-color: var(--charcoal-5); }
    .modal-status {
      font-size: 0.74rem; text-align: center; font-weight: 300; min-height: 16px;
      word-break: break-all;
    }
    .modal-status.ok  { color: #6dbf67; }
    .modal-status.err { color: #e07070; }
    .modal-status.loading { color: var(--text-muted); }

    @media (max-width: 480px) {
      header { padding: 12px 16px; }
      .header-badge { display: none; }
      #messages { padding: 18px 12px; }
      #input-area { padding: 12px; }
      .plan-page-btn { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-mark">
    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
  </div>
  <div class="header-text">
    <h1>Treasury Aesthetics</h1>
    <p>Physician-Led Medical Aesthetics · Toronto</p>
  </div>
  <div class="header-badge">Treatment Advisor</div>
</header>

<div id="messages">
  <div class="msg-row bot">
    <div class="avatar bot-av">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    <div class="msg-content">
      <div class="bubble">Ready to build a treatment plan. Select a concern below or type the patient's situation directly.</div>
    </div>
  </div>
</div>

<div id="quick-bar">
  <button class="quick-btn" data-prompt="Patient concern: Active acne and breakouts. Build a full treatment plan.">Acne</button>
  <button class="quick-btn" data-prompt="Patient concern: Anti-aging, fine lines, skin laxity. Build a full treatment plan.">Anti-Aging</button>
  <button class="quick-btn" data-prompt="Patient concern: Rosacea and facial redness. Build a full treatment plan.">Rosacea</button>
  <button class="quick-btn" data-prompt="Patient concern: Pigmentation and melasma. Build a full treatment plan.">Pigmentation</button>
  <button class="quick-btn" data-prompt="Patient concern: Acne scarring (rolling and boxcar scars). Build a full treatment plan.">Acne Scarring</button>
  <button class="quick-btn" data-prompt="Patient concern: Hair thinning and loss. Build a full treatment plan.">Hair Loss</button>
  <button class="quick-btn" data-prompt="Patient concern: Skin texture, enlarged pores, dullness. Build a full treatment plan.">Texture / Pores</button>
  <button class="quick-btn" data-prompt="Patient concern: Prejuvenation — prevention and maintenance, under 35. Build a full treatment plan.">Prejuvenation</button>
  <button class="quick-btn" data-prompt="Patient concern: Skin tightening and laxity on face and neck. Build a full treatment plan.">Tightening</button>
</div>

<div id="input-area">
  <textarea id="user-input" rows="1" placeholder="Describe your skin concerns or ask anything…" aria-label="Your message"></textarea>
  <button id="send-btn" aria-label="Send">
    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
  </button>
</div>

<footer>Treasury Aesthetics · Toronto · <a href="mailto:aesthetics@treasuryhealth.ca">aesthetics@treasuryhealth.ca</a></footer>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('user-input');
  const sendBtn    = document.getElementById('send-btn');
  const BOT_ICON   = `<svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>`;

  let history = [];

  /* ── Scroll ── */
  function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

  /* ── HTML escape ── */
  function escHtml(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── Parse plan tags out of a response ── */
  function parseResponse(text) {
    const match = text.match(/<plan>([\s\S]*?)<\/plan>/i);
    if (!match) return { textBefore: text, plan: null, textAfter: '' };
    const before = text.slice(0, match.index).trim();
    const after  = text.slice(match.index + match[0].length).trim();
    try {
      const plan = JSON.parse(match[1].trim());
      return { textBefore: before, plan, textAfter: after };
    } catch {
      return { textBefore: text, plan: null, textAfter: '' };
    }
  }

  /* ── Price lookup by treatment/product name ── */
  function lookupPrice(name) {
    const n = name.toLowerCase();
    if (/deeprf|body.*rf|rf.*body/i.test(n))               return 699;
    if (/exactrf|periorbital/i.test(n))                    return 649;
    if (/virturf|smartrf|rf microneedl/i.test(n))          return 799;
    if (/ablative/i.test(n))                               return 1499;
    if (/nouvaglo|nouvaderm|nouvaderm/i.test(n))           return 649;
    if (/oxygeneo/i.test(n))                               return 299;
    if (/dermatwist|collagen induction|\bcit\b/i.test(n))  return 449;
    if (/pladuo.*acne|acne.*argon/i.test(n))               return 299;
    if (/pladuo|plasma/i.test(n))                          return 449;
    if (/\bled\b|triwave/i.test(n))                        return 99;
    if (/quanta.*carbon|carbon.*facial/i.test(n))          return 349;
    if (/quanta/i.test(n))                                 return 399;
    if (/observ|consultation/i.test(n))                    return 0;
    if (/purasomes/i.test(n))                              return 299;
    if (/exo.e|exo\|e/i.test(n))                          return 149;
    if (/vamp/i.test(n))                                   return 249;
    if (/kerafactor/i.test(n))                             return 149;
    if (/de.rive|de\|rive/i.test(n))                       return 149;
    if (/core rose/i.test(n))                              return 199;
    if (/epicutis/i.test(n))                               return 95;
    if (/pavise/i.test(n))                                 return 75;
    if (/noon/i.test(n))                                   return 85;
    return 0;
  }

  function fmtCAD(n) {
    return '$' + Math.max(0, n).toLocaleString('en-CA', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  }

  /* ── Recalculate plan totals ── */
  function recalcPlan(widget) {
    let subtotal = 0;
    widget.querySelectorAll('.plan-item').forEach(row => {
      if (row.querySelector('.plan-item-check')?.checked) {
        const price = parseFloat(row.querySelector('.price-input')?.value || 0) || 0;
        const qty   = parseInt(row.querySelector('.qty-val')?.textContent || 1) || 1;
        const line  = price * qty;
        subtotal   += line;
        const lt = row.querySelector('.line-total');
        if (lt) lt.textContent = line > 0 ? fmtCAD(line) : '—';
      } else {
        const lt = row.querySelector('.line-total');
        if (lt) lt.textContent = '—';
      }
    });

    const subtotalEl = widget.querySelector('.plan-subtotal-val');
    if (subtotalEl) subtotalEl.textContent = fmtCAD(subtotal);

    const discType = widget.querySelector('.disc-type-sel')?.value || 'pct';
    const discAmt  = parseFloat(widget.querySelector('.disc-amount-input')?.value || 0) || 0;
    const discOff  = discType === 'pct' ? subtotal * (discAmt / 100) : discAmt;
    const grand    = Math.max(0, subtotal - discOff);

    const discEl = widget.querySelector('.plan-disc-val');
    if (discEl) discEl.textContent = discOff > 0 ? '−' + fmtCAD(discOff) : '—';

    const grandEl = widget.querySelector('.plan-grand-val');
    if (grandEl) grandEl.textContent = fmtCAD(grand);
  }

  /* ── Extract live plan state from widget ── */
  function extractLivePlan(widget) {
    const title    = widget.querySelector('.plan-title')?.textContent || 'Treatment Plan';
    const sections = [];
    widget.querySelectorAll('.plan-section').forEach(sec => {
      const name  = sec.querySelector('.plan-section-name')?.textContent || '';
      const items = [];
      sec.querySelectorAll('.plan-item').forEach(row => {
        items.push({
          name:    row.querySelector('.plan-item-name')?.textContent  || '',
          detail:  row.querySelector('.plan-item-detail')?.textContent || '',
          checked: row.querySelector('.plan-item-check')?.checked ?? true,
          price:   parseFloat(row.querySelector('.price-input')?.value || 0) || 0,
          qty:     parseInt(row.querySelector('.qty-val')?.textContent  || 1) || 1,
        });
      });
      if (items.length) sections.push({ name, items });
    });
    const discType = widget.querySelector('.disc-type-sel')?.value || 'pct';
    const discAmt  = parseFloat(widget.querySelector('.disc-amount-input')?.value || 0) || 0;
    return { title, sections, discount: { type: discType, value: discAmt } };
  }

  /* ── Build plan widget DOM ── */
  function buildPlanWidget(plan) {
    const widget = document.createElement('div');
    widget.className = 'plan-widget';

    const header = document.createElement('div');
    header.className = 'plan-header';
    header.innerHTML = `
      <span class="plan-header-icon">◆</span>
      <span class="plan-title">${escHtml(plan.title || 'Treatment Plan')}</span>
      <button class="plan-page-btn">↗ Page</button>
      <button class="plan-export-btn">↓ Word</button>
      <button class="plan-copy-btn">Copy</button>`;
    widget.appendChild(header);

    header.querySelector('.plan-copy-btn').addEventListener('click', () => copyPlan(widget, plan));
    header.querySelector('.plan-export-btn').addEventListener('click', () => exportPlan(widget, extractLivePlan(widget)));
    header.querySelector('.plan-page-btn').addEventListener('click', () => openGenerateModal(extractLivePlan(widget)));

    const sectionsEl = document.createElement('div');
    sectionsEl.className = 'plan-sections';
    (plan.sections || []).forEach(section => {
      sectionsEl.appendChild(buildSection(section, widget));
    });
    widget.appendChild(sectionsEl);

    /* Footer: totals + discount */
    const footer = document.createElement('div');
    footer.className = 'plan-footer';
    footer.innerHTML = `
      <div class="plan-total-row">
        <span class="plan-total-label">Subtotal</span>
        <span class="plan-subtotal-val">$0</span>
      </div>
      <div class="plan-discount-row">
        <span class="plan-total-label">Discount</span>
        <span class="disc-spacer"></span>
        <select class="disc-type-sel">
          <option value="pct">%</option>
          <option value="flat">$ off</option>
        </select>
        <input type="number" class="disc-amount-input" value="0" min="0" max="100" step="1" placeholder="0">
        <span class="plan-disc-val">—</span>
      </div>
      <div class="plan-total-row plan-grand-row">
        <span class="plan-total-label">Total</span>
        <span class="plan-grand-val">$0</span>
      </div>`;
    widget.appendChild(footer);

    footer.querySelector('.disc-type-sel').addEventListener('change', () => recalcPlan(widget));
    footer.querySelector('.disc-amount-input').addEventListener('input', () => recalcPlan(widget));

    recalcPlan(widget);
    return widget;
  }

  function buildSection(section, widget) {
    const el = document.createElement('div');
    el.className = 'plan-section';

    const headerEl = document.createElement('div');
    headerEl.className = 'plan-section-header';
    headerEl.innerHTML = `
      <span class="plan-section-name">${escHtml(section.name || '')}</span>
      <button class="add-item-btn">＋ Add</button>`;
    el.appendChild(headerEl);

    const itemsEl = document.createElement('div');
    itemsEl.className = 'plan-items';
    (section.items || []).forEach(item => itemsEl.appendChild(buildItem(item, widget)));
    el.appendChild(itemsEl);

    headerEl.querySelector('.add-item-btn').addEventListener('click', () => {
      showAddItemRow(itemsEl, widget);
    });

    return el;
  }

  function buildItem(item, widget) {
    const row       = document.createElement('div');
    row.className   = 'plan-item';
    const isChecked = item.checked !== false;
    row.dataset.checked = isChecked;

    const price = item.price !== undefined ? item.price : lookupPrice(item.name || '');
    const qty   = item.qty   !== undefined ? item.qty   : parseSessionCount(item.detail);

    row.innerHTML = `
      <input type="checkbox" class="plan-item-check" ${isChecked ? 'checked' : ''}>
      <div class="plan-item-body">
        <span class="plan-item-name">${escHtml(item.name || '')}</span>
        ${item.detail ? `<span class="plan-item-detail">${escHtml(item.detail)}</span>` : ''}
      </div>
      <div class="plan-item-controls">
        <div class="price-wrap">
          <span class="price-prefix">$</span>
          <input type="number" class="price-input" value="${price}" min="0" step="5" title="Price per session">
        </div>
        <div class="qty-ctrl">
          <button class="qty-btn qty-minus" title="Decrease">−</button>
          <span class="qty-val">${qty}</span>
          <button class="qty-btn qty-plus" title="Increase">+</button>
        </div>
        <span class="line-total">—</span>
      </div>
      <button class="delete-item-btn" title="Remove">×</button>`;

    row.querySelector('.plan-item-check').addEventListener('change', e => {
      row.dataset.checked = e.target.checked;
      if (widget) recalcPlan(widget);
    });
    row.querySelector('.price-input').addEventListener('input', () => { if (widget) recalcPlan(widget); });
    row.querySelector('.qty-minus').addEventListener('click', () => {
      const qv = row.querySelector('.qty-val');
      const n  = Math.max(1, parseInt(qv.textContent) - 1);
      qv.textContent = n;
      if (widget) recalcPlan(widget);
    });
    row.querySelector('.qty-plus').addEventListener('click', () => {
      const qv = row.querySelector('.qty-val');
      qv.textContent = parseInt(qv.textContent) + 1;
      if (widget) recalcPlan(widget);
    });
    row.querySelector('.delete-item-btn').addEventListener('click', () => {
      row.remove();
      if (widget) recalcPlan(widget);
    });

    return row;
  }

  function showAddItemRow(itemsEl, widget) {
    if (itemsEl.querySelector('.add-item-row')) return;

    const row = document.createElement('div');
    row.className = 'add-item-row';
    row.innerHTML = `
      <input class="add-item-input" placeholder="Product or treatment name…" />
      <button class="add-item-confirm">Add</button>
      <button class="add-item-cancel">Cancel</button>`;

    const input = row.querySelector('.add-item-input');
    row.querySelector('.add-item-confirm').addEventListener('click', () => {
      const val = input.value.trim();
      if (val) {
        itemsEl.insertBefore(buildItem({ name: val, checked: true }, widget), row);
        if (widget) recalcPlan(widget);
      }
      row.remove();
    });
    row.querySelector('.add-item-cancel').addEventListener('click', () => row.remove());
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') row.querySelector('.add-item-confirm').click();
      if (e.key === 'Escape') row.remove();
    });

    itemsEl.appendChild(row);
    input.focus();
  }

  /* ── Copy plan as plain text ── */
  function copyPlan(widget, originalPlan) {
    const lines = [originalPlan.title || 'Treatment Plan', ''];
    widget.querySelectorAll('.plan-section').forEach(sec => {
      const name = sec.querySelector('.plan-section-name')?.textContent || '';
      lines.push(name.toUpperCase());
      sec.querySelectorAll('.plan-item').forEach(item => {
        const checked = item.querySelector('.plan-item-check')?.checked;
        const name    = item.querySelector('.plan-item-name')?.textContent || '';
        const detail  = item.querySelector('.plan-item-detail')?.textContent || '';
        lines.push(`${checked ? '✓' : '○'} ${name}${detail ? ' — ' + detail : ''}`);
      });
      lines.push('');
    });
    navigator.clipboard.writeText(lines.join('\n')).then(() => {
      const btn = widget.querySelector('.plan-copy-btn');
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy', 2000);
    });
  }

  /* ── Export plan as Word doc ── */
  async function exportPlan(widget, originalPlan) {
    const btn = widget.querySelector('.plan-export-btn');
    btn.textContent = 'Exporting…';
    btn.disabled = true;

    const livePlan = { title: originalPlan.title, sections: [] };
    widget.querySelectorAll('.plan-section').forEach(sec => {
      const name  = sec.querySelector('.plan-section-name')?.textContent || '';
      const items = [];
      sec.querySelectorAll('.plan-item').forEach(item => {
        items.push({
          name:    item.querySelector('.plan-item-name')?.textContent  || '',
          detail:  item.querySelector('.plan-item-detail')?.textContent || '',
          checked: item.querySelector('.plan-item-check')?.checked ?? true,
        });
      });
      if (items.length) livePlan.sections.push({ name, items });
    });

    try {
      const res = await fetch('/export', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ plan: livePlan }),
      });
      if (!res.ok) throw new Error(await res.text());
      const blob = await res.blob();
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = `Treasury_Aesthetics_${livePlan.title.replace(/\s+/g,'_').slice(0,60)}.docx`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      btn.textContent = '✓ Downloaded';
      setTimeout(() => { btn.textContent = '↓ Word'; btn.disabled = false; }, 2500);
    } catch (err) {
      btn.textContent = 'Error';
      setTimeout(() => { btn.textContent = '↓ Word'; btn.disabled = false; }, 2500);
      console.error('Export failed:', err);
    }
  }

  /* ── Add a message row to the chat ── */
  function addMessage(role, text) {
    const row = document.createElement('div');
    row.className = `msg-row ${role === 'user' ? 'user' : 'bot'}`;

    const av = document.createElement('div');
    av.className = role === 'user' ? 'avatar user-av' : 'avatar bot-av';
    av.innerHTML = role === 'user' ? 'YOU' : BOT_ICON;

    const content = document.createElement('div');
    content.className = 'msg-content';

    if (role === 'user') {
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      content.appendChild(bubble);
      row.appendChild(content);
      row.appendChild(av);
    } else {
      const { textBefore, plan, textAfter } = parseResponse(text);

      if (textBefore) {
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = textBefore;
        content.appendChild(bubble);
      }

      if (plan) {
        content.appendChild(buildPlanWidget(plan));
      }

      if (textAfter) {
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = textAfter;
        content.appendChild(bubble);
      }

      if (!textBefore && !plan && !textAfter) {
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        content.appendChild(bubble);
      }

      row.appendChild(av);
      row.appendChild(content);
    }

    messagesEl.appendChild(row);
    scrollBottom();
  }

  /* ── Typing indicator ── */
  function showTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row bot'; row.id = 'typing-row';
    const av = document.createElement('div');
    av.className = 'avatar bot-av'; av.innerHTML = BOT_ICON;
    const content = document.createElement('div');
    content.className = 'msg-content';
    const bubble = document.createElement('div');
    bubble.className = 'bubble typing-dots';
    bubble.innerHTML = '<span></span><span></span><span></span>';
    content.appendChild(bubble);
    row.appendChild(av); row.appendChild(content);
    messagesEl.appendChild(row);
    scrollBottom();
  }
  function hideTyping() { document.getElementById('typing-row')?.remove(); }

  /* ── Send ── */
  async function send() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = ''; inputEl.style.height = 'auto';
    sendBtn.disabled = true;

    addMessage('user', text);
    showTyping();

    try {
      const res  = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history }),
      });
      const data = await res.json();
      hideTyping();

      const reply = data.reply || data.error || 'Something went wrong. Please try again.';
      addMessage('assistant', reply);

      history.push({ role: 'user',      content: text  });
      history.push({ role: 'assistant', content: reply });
      if (history.length > 40) history = history.slice(-40);

    } catch {
      hideTyping();
      addMessage('assistant', 'Connection error — please check your network and try again.');
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  document.querySelectorAll('.quick-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      inputEl.value = btn.dataset.prompt;
      send();
    });
  });

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 130) + 'px';
  });
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  sendBtn.addEventListener('click', send);

  /* ═══════════════════════════════════════════════════════════════
     PATIENT PAGE GENERATOR
  ═══════════════════════════════════════════════════════════════ */

  /* ── TX session interval lookup ── */
  const TX_INTERVALS = [
    { test: n => /virturf|smartrf|deeprf|exactrf|rf microneedl/i.test(n), wk: 5 },
    { test: n => /nouvaderm.*ablat|ablat.*laser|ablative/i.test(n),        wk: 10 },
    { test: n => /nouvaglo|nouvaderm/i.test(n),                            wk: 4  },
    { test: n => /oxygeneo/i.test(n),                                      wk: 3  },
    { test: n => /dermatwist|collagen induction|\bcit\b/i.test(n),         wk: 4  },
    { test: n => /pladuo.*acne|acne.*argon|argon.*acne/i.test(n),          wk: 1  },
    { test: n => /pladuo|plasma/i.test(n),                                 wk: 4  },
    { test: n => /\bled\b|triwave/i.test(n),                               wk: 1  },
    { test: n => /quanta.*carbon|carbon.*facial/i.test(n),                 wk: 3  },
    { test: n => /quanta/i.test(n),                                        wk: 4  },
  ];

  function txInterval(name) {
    const n = name.toLowerCase();
    for (const e of TX_INTERVALS) if (e.test(n)) return e.wk;
    return 4;
  }

  function parseSessionCount(detail) {
    if (!detail) return 3;
    const m = detail.match(/(\d+)/);
    if (!m) return 3;
    return Math.min(Math.max(parseInt(m[1]), 1), 12);
  }

  function addWeeks(dateStr, weeks) {
    const d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + weeks * 7);
    return d;
  }

  function fmtDateLong(d) {
    if (!d) return 'Date TBD';
    return d.toLocaleDateString('en-CA', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
  }

  function slugify(first, last) {
    return ((first || '') + (last || '')).toLowerCase().replace(/[^a-z0-9]/g, '');
  }

  function pwFromDob(dob) {
    if (!dob) return '';
    const parts = dob.split('-');
    return (parts[1] || '') + (parts[2] || '') + (parts[0] || '');
  }

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  /* ── Build the complete patient HTML page ── */
  function buildPatientHTML(plan, pt) {
    const e = str => escHtml(str);
    const firstName  = (pt.firstName || '').trim();
    const lastName   = (pt.lastName  || '').trim();
    const fullName   = [firstName, lastName].filter(Boolean).join(' ');
    const displayName = firstName || fullName || 'Your';
    const password   = pwFromDob(pt.dob);
    const concern    = (pt.concern || plan.title || '').trim();
    const startDate  = pt.startDate || '';
    const notes      = (pt.notes || '').trim();
    const today      = new Date();

    const sections   = plan.sections || [];
    const clinicSec  = sections.find(s => s.name === 'In-Clinic Treatments');
    const amSec      = sections.find(s => s.name === 'Morning Routine');
    const pmSec      = sections.find(s => s.name === 'Evening Routine');
    const postSec    = sections.find(s => s.name === 'Post-Procedure Recovery');
    const extraSecs  = sections.filter(s =>
      !['In-Clinic Treatments','Morning Routine','Evening Routine','Post-Procedure Recovery'].includes(s.name)
    );

    /* Treatment groups */
    const txItems  = (clinicSec ? clinicSec.items || [] : []).filter(i => i.checked !== false);
    let totalSess  = 0;
    const txGroups = txItems.map(item => {
      const count = item.qty || parseSessionCount(item.detail);
      const wk    = txInterval(item.name);
      totalSess  += count;
      return { item, count, wk };
    });

    /* Build treatment journey HTML */
    let txHtml = '';
    txGroups.forEach(g => {
      const wkLabel  = g.wk === 0 ? 'One-time treatment' : g.wk === 1 ? 'Weekly' : 'Every ' + g.wk + ' weeks';
      const sessLabel = g.count + ' session' + (g.count > 1 ? 's' : '') + ' recommended';
      const rationale = g.item.detail || '';
      txHtml += '<div class="tx-group">';
      txHtml += '<div class="tx-card">';
      txHtml += '<div class="tx-card-head">';
      txHtml += '<div class="tx-name">' + e(g.item.name) + '</div>';
      txHtml += '<div class="tx-sessions-badge">' + e(sessLabel) + '</div>';
      txHtml += '</div>';
      txHtml += '<div class="tx-card-body">';
      txHtml += '<div class="tx-detail-row"><span class="tx-detail-label">Frequency</span><span class="tx-detail-val">' + e(wkLabel) + '</span></div>';
      if (rationale) txHtml += '<div class="tx-detail-row tx-rationale"><span class="tx-detail-label">Rationale</span><span class="tx-detail-val">' + e(rationale) + '</span></div>';
      txHtml += '</div></div></div>';
    });

    /* Build routine items HTML */
    function routineItems(sec) {
      if (!sec) return '';
      let h = '<div class="product-list">';
      (sec.items || []).filter(i => i.checked !== false).forEach(item => {
        h += '<div class="product-card"><div class="product-name">' + e(item.name) + '</div>';
        if (item.detail) h += '<div class="product-detail">' + e(item.detail) + '</div>';
        h += '</div>';
      });
      return h + '</div>';
    }

    /* Build extra sections HTML */
    const allExtra = postSec ? [postSec, ...extraSecs] : extraSecs;
    let extraHtml = '';
    allExtra.forEach(sec => {
      const items = (sec.items || []);
      if (!items.length) return;
      extraHtml += '<div class="extra-sec">';
      extraHtml += '<div class="extra-sec-name">' + e(sec.name) + '</div>';
      extraHtml += '<div class="extra-items">';
      items.forEach(item => {
        const ck = item.checked !== false;
        extraHtml += '<div class="extra-item' + (ck ? ' ei-checked' : '') + '">';
        extraHtml += '<div class="ei-check">' + (ck ? '✓' : '○') + '</div>';
        extraHtml += '<div class="ei-body"><div class="ei-name">' + e(item.name) + '</div>';
        if (item.detail) extraHtml += '<div class="ei-detail">' + e(item.detail) + '</div>';
        extraHtml += '</div></div>';
      });
      extraHtml += '</div></div>';
    });

    /* Section counter */
    let sn = 1;
    const secNum = () => { const n = sn; sn++; return pad2(n); };

    /* Start date display */
    const startDisp = startDate
      ? new Date(startDate + 'T00:00:00').toLocaleDateString('en-CA', { year:'numeric', month:'long', day:'numeric' })
      : 'To Be Confirmed';

    /* Inline gate script — no template literals, safe concatenation */
    const gateScript =
      '(function(){' +
      'var PW="' + password + '";' +
      'function chk(){' +
      'var v=document.getElementById("gi").value.trim();' +
      'if(v===PW){sessionStorage.setItem("ta-u","1");' +
      'document.getElementById("gate").style.display="none";' +
      'document.getElementById("main").removeAttribute("hidden");}' +
      'else{document.getElementById("ge").textContent="Incorrect — please try again.";}' +
      '}' +
      'document.getElementById("gi").addEventListener("keydown",function(ev){if(ev.key==="Enter")chk();});' +
      'document.getElementById("gb").addEventListener("click",chk);' +
      'if(sessionStorage.getItem("ta-u")==="1"){' +
      'document.getElementById("gate").style.display="none";' +
      'document.getElementById("main").removeAttribute("hidden");}' +
      '})();';

    let h = '<!DOCTYPE html>\n<html lang="en">\n<head>\n';
    h += '<meta charset="UTF-8">\n';
    h += '<meta name="viewport" content="width=device-width,initial-scale=1.0">\n';
    h += '<title>Treasury Aesthetics — ' + e(fullName || 'Your Plan') + '</title>\n';
    h += '<link rel="preconnect" href="https://fonts.googleapis.com">\n';
    h += '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n';
    h += '<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">\n';
    h += '<style>' + PATIENT_CSS + '</style>\n';
    h += '</head>\n<body>\n';

    /* Gate overlay */
    h += '<div id="gate" class="gate-overlay">';
    h += '<div class="gate-box">';
    h += '<div class="gate-logo">Treasury Aesthetics</div>';
    h += '<h2 class="gate-title">Your Plan is Ready</h2>';
    h += '<p class="gate-sub">Enter your date of birth to access your personalized plan.</p>';
    h += '<div class="gate-hint">Format: MMDDYYYY</div>';
    h += '<input id="gi" class="gate-input" type="password" placeholder="01151990" maxlength="8" inputmode="numeric">';
    h += '<button id="gb" class="gate-btn">Access My Plan</button>';
    h += '<p id="ge" class="gate-err"></p>';
    h += '</div></div>';

    /* Main content */
    h += '<div id="main" hidden>';

    /* Site header */
    h += '<header class="site-header"><div class="site-header-inner">';
    h += '<div class="site-name">Treasury Aesthetics</div>';
    h += '<div class="site-sub">Toronto, Ontario</div>';
    h += '</div></header>';

    /* Hero */
    h += '<section class="hero"><div class="hero-inner">';
    h += '<div class="hero-tag">Personalized Treatment Plan</div>';
    h += '<h1 class="hero-name">' + e(displayName) + (firstName ? '&#39;s' : '') + ' Investment</h1>';
    if (concern) h += '<p class="hero-concern">' + e(concern) + '</p>';
    h += '<div class="hero-stats">';
    if (totalSess > 0) {
      h += '<div class="hero-stat"><div class="hs-val">' + totalSess + '</div><div class="hs-label">Planned Sessions</div></div>';
      h += '<div class="hero-stat-div"></div>';
    }
    h += '<div class="hero-stat"><div class="hs-val">' + e(startDisp) + '</div><div class="hs-label">Plan Start</div></div>';
    h += '</div></div></section>';

    /* Treatment Journey */
    if (txGroups.length > 0) {
      h += '<section class="content-section"><div class="section-inner">';
      h += '<div class="section-num">' + secNum() + '</div>';
      h += '<h2 class="section-title">Treatment Journey</h2>';
      h += txHtml;
      h += '</div></section>';
    }

    /* Home Care Protocol */
    if (amSec || pmSec) {
      h += '<section class="content-section alt-bg"><div class="section-inner">';
      h += '<div class="section-num">' + secNum() + '</div>';
      h += '<h2 class="section-title">Home Care Protocol</h2>';
      h += '<div class="homecare-grid">';
      if (amSec) {
        h += '<div class="routine-col"><div class="routine-header">';
        h += '<span class="rh-dot am-dot"></span>Morning Routine</div>';
        h += routineItems(amSec) + '</div>';
      }
      if (pmSec) {
        h += '<div class="routine-col"><div class="routine-header">';
        h += '<span class="rh-dot pm-dot"></span>Evening Routine</div>';
        h += routineItems(pmSec) + '</div>';
      }
      h += '</div></div></section>';
    }

    /* Extra sections (Biologics, Post-Procedure, Membership, etc.) */
    if (extraHtml) {
      h += '<section class="content-section"><div class="section-inner">';
      h += '<div class="section-num">' + secNum() + '</div>';
      h += '<h2 class="section-title">Add-Ons &amp; Recommendations</h2>';
      h += extraHtml;
      h += '</div></section>';
    }

    /* Investment Summary */
    const allPricedSecs = sections.filter(s => !['Post-Procedure Recovery'].includes(s.name));
    let hasPrice = false;
    let summaryHtml = '';
    let summarySubtotal = 0;
    allPricedSecs.forEach(sec => {
      (sec.items || []).filter(i => i.checked !== false && (i.price || 0) > 0).forEach(item => {
        const lineTotal = (item.price || 0) * (item.qty || 1);
        summarySubtotal += lineTotal;
        hasPrice = true;
        summaryHtml += '<div class="inv-row">';
        summaryHtml += '<span class="inv-name">' + e(item.name) + (item.qty > 1 ? ' &times; ' + item.qty : '') + '</span>';
        summaryHtml += '<span class="inv-amount">' + fmtCAD(lineTotal) + '</span>';
        summaryHtml += '</div>';
      });
    });

    if (hasPrice) {
      const disc = plan.discount || {};
      const discOff = disc.type === 'pct'
        ? summarySubtotal * ((disc.value || 0) / 100)
        : (disc.value || 0);
      const grand = Math.max(0, summarySubtotal - discOff);

      summaryHtml += '<div class="inv-subtotal"><span>Subtotal</span><span>' + fmtCAD(summarySubtotal) + '</span></div>';
      if (discOff > 0) {
        const discLabel = disc.type === 'pct' ? (disc.value + '% discount') : 'Discount';
        summaryHtml += '<div class="inv-disc"><span>' + e(discLabel) + '</span><span>−' + fmtCAD(discOff) + '</span></div>';
      }
      summaryHtml += '<div class="inv-total"><span>Investment Total</span><span>' + fmtCAD(grand) + '</span></div>';

      h += '<section class="content-section alt-bg"><div class="section-inner">';
      h += '<div class="section-num">' + secNum() + '</div>';
      h += '<h2 class="section-title">Investment Summary</h2>';
      h += '<div class="inv-table">' + summaryHtml + '</div>';
      h += '</div></section>';
    }

    /* Physician Notes */
    if (notes) {
      h += '<section class="notes-section"><div class="section-inner">';
      h += '<div class="section-tag">Physician Notes</div>';
      h += '<div class="notes-body">' + e(notes).replace(/\n/g, '<br>') + '</div>';
      h += '</div></section>';
    }

    /* CTA */
    h += '<section class="cta-section"><div class="cta-inner">';
    h += '<p class="cta-sub">Ready to begin your investment?</p>';
    h += '<a href="mailto:aesthetics@treasuryhealth.ca" class="cta-btn">Book Your Next Session</a>';
    h += '</div></section>';

    /* Footer */
    h += '<footer class="site-footer"><div class="footer-inner">';
    h += '<div class="footer-clinic">Treasury Aesthetics</div>';
    h += '<div class="footer-detail">Toronto, Ontario &nbsp;&middot;&nbsp; ';
    h += '<a href="mailto:aesthetics@treasuryhealth.ca">aesthetics@treasuryhealth.ca</a>';
    h += ' &nbsp;&middot;&nbsp; <a href="https://treasuryhealth.ca">treasuryhealth.ca</a></div>';
    h += '<div class="footer-note">This plan was prepared exclusively for you by Treasury Aesthetics.</div>';
    h += '<button class="admin-edit-btn" onclick="showAdmGate()">&#9998; Edit</button>';
    h += '</div></footer>';

    h += '</div>\n';

    const adminScript =
      '(function(){' +
      'var APW="2896Laser";' +
      'var ESEL=[".hero-name",".hero-concern",".tx-name",".tx-meta",".sc-date",".product-name",".product-detail",".ei-name",".ei-detail",".notes-body",".inv-name",".inv-amount",".inv-total span",".inv-subtotal span",".inv-disc span"].join(",");' +

      'window.showAdmGate=function(){' +
      'if(document.getElementById("adm-overlay"))return;' +
      'var o=document.createElement("div");o.className="adm-overlay";o.id="adm-overlay";' +
      'o.innerHTML="<div class=\\"adm-box\\"><div class=\\"adm-title\\">Admin Access</div>' +
      '<input id=\\"adm-pw\\" class=\\"adm-input\\" type=\\"password\\" placeholder=\\"Password\\">' +
      '<div class=\\"adm-actions\\"><button class=\\"adm-cancel\\">Cancel<\\/button><button class=\\"adm-confirm\\">Enter<\\/button><\\/div>' +
      '<p id=\\"adm-err\\" class=\\"adm-err\\"><\\/p><\\/div>";' +
      'document.body.appendChild(o);' +
      'var inp=document.getElementById("adm-pw");inp.focus();' +
      'function chk(){if(inp.value===APW){o.remove();enableEdit();}else{document.getElementById("adm-err").textContent="Incorrect password.";}}' +
      'inp.addEventListener("keydown",function(e){if(e.key==="Enter")chk();});' +
      'o.querySelector(".adm-confirm").addEventListener("click",chk);' +
      'o.querySelector(".adm-cancel").addEventListener("click",function(){o.remove();});' +
      '};' +

      'function enableEdit(){' +
      'var bar=document.createElement("div");bar.className="edit-bar";bar.id="edit-bar";' +
      'bar.innerHTML="<span class=\\"edit-bar-label\\">&#9998; Edit Mode<\\/span>' +
      '<span class=\\"edit-bar-hint\\">Click any text to edit<\\/span>' +
      '<button class=\\"edit-bar-btn eb-dl\\" onclick=\\"dlEdited()\\">&#8595; Download<\\/button>' +
      '<button class=\\"edit-bar-btn eb-exit\\" onclick=\\"exitEdit()\\">Exit<\\/button>";' +
      'document.body.insertBefore(bar,document.body.firstChild);' +
      'document.body.classList.add("edit-mode");' +
      'document.querySelectorAll(ESEL).forEach(function(el){el.setAttribute("contenteditable","true");el.setAttribute("spellcheck","false");});' +
      'document.querySelectorAll(".sc-badge").forEach(function(b){' +
      'b.style.cursor="pointer";b.title="Click to toggle";' +
      'b.addEventListener("click",function(){' +
      'var card=b.closest(".session-card");' +
      'if(b.textContent==="UPCOMING"){b.textContent="COMPLETED";b.className="sc-badge sb-done";card&&card.classList.add("sc-done");}' +
      'else{b.textContent="UPCOMING";b.className="sc-badge sb-next";card&&card.classList.remove("sc-done");}' +
      '});' +
      '});' +
      '}' +

      'window.exitEdit=function(){' +
      'document.querySelectorAll("[contenteditable]").forEach(function(el){el.removeAttribute("contenteditable");});' +
      'document.body.classList.remove("edit-mode");' +
      'var bar=document.getElementById("edit-bar");if(bar)bar.remove();' +
      'document.querySelectorAll(".sc-badge").forEach(function(b){b.style.cursor="";b.title="";});' +
      '};' +

      'window.dlEdited=function(){' +
      'var bar=document.getElementById("edit-bar");if(bar)bar.style.display="none";' +
      'document.body.classList.remove("edit-mode");' +
      'var html="<!DOCTYPE html>"+document.documentElement.outerHTML;' +
      'if(bar)bar.style.display="";' +
      'document.body.classList.add("edit-mode");' +
      'var blob=new Blob([html],{type:"text/html"});' +
      'var url=URL.createObjectURL(blob);' +
      'var a=document.createElement("a");a.href=url;' +
      'a.download=document.title.replace(/[^a-z0-9]/gi,"-").toLowerCase()+".html";' +
      'document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);' +
      '};' +
      '})();';

    h += '<script>' + gateScript + adminScript + '<\/script>\n';
    h += '</body>\n</html>';

    return h;
  }

  /* ═══════════════════════════════════════════════════════════════
     MODAL
  ═══════════════════════════════════════════════════════════════ */

  let _currentPlan = null;

  function openGenerateModal(plan) {
    _currentPlan = plan;
    document.getElementById('generate-modal')?.remove();

    const concern = escHtml(plan.title || '');

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'generate-modal';
    overlay.innerHTML = `
      <div class="modal">
        <div class="modal-head">
          <span class="modal-head-title">Generate Patient Page</span>
          <button class="modal-close" id="mcls">&times;</button>
        </div>
        <div class="modal-body">
          <div class="mf-row">
            <div class="modal-field">
              <label class="modal-label">First Name</label>
              <input id="m-fn" class="modal-input" type="text" placeholder="Sarah" autocomplete="off">
            </div>
            <div class="modal-field">
              <label class="modal-label">Last Name</label>
              <input id="m-ln" class="modal-input" type="text" placeholder="Chen" autocomplete="off">
            </div>
          </div>
          <div class="mf-row">
            <div class="modal-field">
              <label class="modal-label">Date of Birth</label>
              <input id="m-dob" class="modal-input" type="date">
            </div>
            <div class="modal-field">
              <label class="modal-label">Plan Start Date</label>
              <input id="m-sd" class="modal-input" type="date">
            </div>
          </div>
          <div class="modal-field">
            <label class="modal-label">Concern / Plan Title</label>
            <input id="m-concern" class="modal-input" type="text" value="${concern}" placeholder="e.g. Rosacea &amp; Skin Texture">
          </div>
          <div class="modal-field">
            <label class="modal-label">Physician Notes (optional)</label>
            <textarea id="m-notes" class="modal-textarea" placeholder="Notes for the patient…"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <div class="modal-actions">
            <button class="modal-btn modal-btn-secondary" id="m-dl">&#8595; Download</button>
            <button class="modal-btn modal-btn-primary" id="m-pub">&#8599; Publish Page</button>
          </div>
          <div class="modal-status" id="m-status"></div>
        </div>
      </div>`;

    document.body.appendChild(overlay);

    document.getElementById('mcls').addEventListener('click', closeModal);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
    document.getElementById('m-dl').addEventListener('click', downloadPatientPage);
    document.getElementById('m-pub').addEventListener('click', publishPatientPage);

    setTimeout(() => document.getElementById('m-fn')?.focus(), 60);
  }

  function closeModal() {
    document.getElementById('generate-modal')?.remove();
    _currentPlan = null;
  }

  function _getModalPt() {
    return {
      firstName: (document.getElementById('m-fn')?.value || '').trim(),
      lastName:  (document.getElementById('m-ln')?.value || '').trim(),
      dob:       document.getElementById('m-dob')?.value || '',
      startDate: document.getElementById('m-sd')?.value || '',
      concern:   (document.getElementById('m-concern')?.value || '').trim(),
      notes:     (document.getElementById('m-notes')?.value || '').trim(),
    };
  }

  function _setStatus(msg, type) {
    const el = document.getElementById('m-status');
    if (!el) return;
    el.textContent = msg;
    el.className = 'modal-status ' + (type || '');
  }

  function downloadPatientPage() {
    if (!_currentPlan) return;
    const pt = _getModalPt();
    if (!pt.firstName && !pt.lastName) { _setStatus('Enter a patient name first.', 'err'); return; }

    const html = buildPatientHTML(_currentPlan, pt);
    const s    = slugify(pt.firstName, pt.lastName) || 'patient';
    const blob = new Blob([html], { type: 'text/html' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = s + '.html';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    _setStatus('Downloaded — ' + s + '.html', 'ok');
  }

  async function publishPatientPage() {
    if (!_currentPlan) return;
    const pt = _getModalPt();

    if (!pt.firstName && !pt.lastName) { _setStatus('Enter a patient name first.', 'err'); return; }

    const btn = document.getElementById('m-pub');
    btn.disabled = true;
    _setStatus('Publishing…', 'loading');

    const html         = buildPatientHTML(_currentPlan, pt);
    const patientName  = [pt.firstName, pt.lastName].filter(Boolean).join(' ');
    const filename     = (slugify(pt.firstName, pt.lastName) || 'patient') + '.html';

    try {
      const res = await fetch('/publish-page', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ html, filename, patientName }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Publish failed');

      _setStatus('Published: ' + data.url, 'ok');

      const dlBtn = document.getElementById('m-dl');
      if (dlBtn) {
        dlBtn.textContent = '⧉ Copy Link';
        dlBtn.onclick = () => {
          navigator.clipboard.writeText(data.url)
            .then(() => _setStatus('Link copied!', 'ok'))
            .catch(() => _setStatus(data.url, 'ok'));
        };
      }
    } catch (err) {
      _setStatus('Error: ' + err.message, 'err');
    } finally {
      btn.disabled = false;
    }
  }
</script>
