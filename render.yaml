services:
  - type: web
    name: skincare-treatment-advisor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: KNOWLEDGE_HUB_URL
        value: https://agent-knowledge-rho.vercel.app/api/knowledge-hub
      - key: KNOWLEDGE_HUB_PASSWORD
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        value: 1MmTsBm_Y9AgIbfr1u6ds7KayUo7Vf44k
      - key: GOOGLE_API_KEY
        sync: false
      - key: GITHUB_KNOWLEDGE_REPO
        value: drlatsky-aesthetics/Skincare
      - key: GITHUB_KNOWLEDGE_PATH
        value: knowledge
      - key: GITHUB_TOKEN
        sync: false
